# Constrói a imagem Docker do Guará Check, testa que ela sobe (SQLite e PostgreSQL) e deixa a imagem pronta para baixar.
# - Todo push na main e todo pull request: constrói + testa + guarda a imagem como arquivo (aba "Actions" > a execução > Artifacts).
# - Tag v* (ex.: v1.0.0) ou execução manual com "publicar" marcado: também publica no GitHub Container Registry (ghcr.io).
name: Imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a imagem no ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Nome da imagem (ghcr.io exige minúsculas)
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guaracheck" >> "$GITHUB_ENV"

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            guaracheck:ci
            guaracheck:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça (SQLite)
        run: |
          docker run -d --name gc -p 8000:8000 -e SECRET_KEY=teste-ci-chave-longa-aleatoria guaracheck:ci
          for i in $(seq 1 40); do curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:8000/api/health
          curl -fsS -o pagina.html http://localhost:8000/ && grep -q "Guará Check" pagina.html
          curl -fsS -o /dev/null http://localhost:8000/assets/icone-192.png
          curl -fsS -o cursos.json http://localhost:8000/api/cursos && grep -q "Direito" cursos.json
          test "$(docker exec gc id -u)" = "10001"
          for i in $(seq 1 20); do
            s="$(docker inspect -f '{{.State.Health.Status}}' gc)"; [ "$s" = "healthy" ] && break; sleep 5
          done
          echo "healthcheck: $s"; test "$s" = "healthy"
          docker logs gc
          docker rm -f gc

      - name: Teste de fumaça (docker compose com PostgreSQL)
        run: |
          printf 'SECRET_KEY=teste-ci-chave-longa-aleatoria\nPOSTGRES_PASSWORD=ci%s\nCHAVE_MASTER=ci-master\n' "$(openssl rand -hex 12)" > .env
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:8000/api/health
          curl -fsS -o cursos.json http://localhost:8000/api/cursos && grep -q "Direito" cursos.json
          curl -fsS -o config.json http://localhost:8000/api/config && grep -q "dominio_aluno" config.json
          docker compose logs app
          docker compose down -v

      - name: Salvar a imagem como arquivo
        run: docker save guaracheck:latest | gzip > guaracheck-imagem.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: guaracheck-imagem
          path: guaracheck-imagem.tar.gz
          retention-days: 30

      - name: Entrar no ghcr.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no ghcr.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        run: |
          versao="${GITHUB_REF_NAME//\//-}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || versao="manual-${GITHUB_SHA::7}"
          docker tag guaracheck:ci "${IMAGEM}:${versao}"
          docker tag guaracheck:ci "${IMAGEM}:latest"
          docker push "${IMAGEM}:${versao}"
          docker push "${IMAGEM}:latest"
