databases:
  - name: geocheckin-db
    plan: free
    databaseName: geocheckin
services:
  - type: web
    name: geocheckin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: geocheckin-db
          property: connectionString
      - key: CHAVE_MASTER
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PATH
        sync: false
      - key: PROXYCHECK_KEY
        sync: false
      - key: VPN_MODO
        value: bloquear
