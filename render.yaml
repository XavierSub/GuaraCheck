databases:
  - name: geocheckin-db
    plan: free
    databaseName: geocheckin
services:
  - type: web
    name: geocheckin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head || echo AVISO migracao falhou; uvicorn app:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: geocheckin-db
          property: connectionString
      - key: CHAVE_MASTER
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PATH
        sync: false
      - key: PROXYCHECK_KEY
        sync: false
      - key: VPN_MODO
        value: bloquear
      # E-mail (código de confirmação do cadastro e aviso de chamada aberta). Plano grátis da Render bloqueia SMTP: use o Brevo (API por HTTPS).
      # EMAIL_REMETENTE precisa ser um remetente VERIFICADO no Brevo; no Brevo, desative o bloqueio por IP (Security > Authorised IPs).
      # Depois de preencher, use "Enviar e-mail de teste" no Resumo da coordenação para conferir.
      - key: EMAIL_PROVEDOR
        value: brevo
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Certificado de participação: bloqueado enquanto esta variável não for 1. Libere quando o modelo da faculdade estiver pronto.
      - key: CERTIFICADO_ATIVO
        sync: false
